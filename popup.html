<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- State A: Not authenticated -->
  <div id="view-login" class="view">
    <div class="header">TickTick Page Saver</div>
    <button id="btn-login" class="btn btn-primary">Connect to TickTick</button>
  </div>

  <!-- State B: Select project -->
  <div id="view-project" class="view" hidden>
    <div class="header">Select Project</div>
    <select id="project-select">
      <option value="">Loading projects...</option>
    </select>
    <button id="btn-save-project" class="btn btn-primary" disabled>Save</button>
  </div>

  <!-- State C: Main view -->
  <div id="view-main" class="view" hidden>
    <div class="header">Add Task</div>
    <div class="preview">
      <div class="label">Title</div>
      <div id="page-title" class="value">—</div>
      <div class="label">URL</div>
      <div id="page-url" class="value url">—</div>
      <div class="label">Project</div>
      <div id="project-name" class="value">—</div>
    </div>
    <button id="btn-add-task" class="btn btn-primary">Add Task</button>
    <a id="btn-change-project" class="link" href="#">change project</a>
  </div>

  <!-- Feedback overlay -->
  <div id="feedback" class="feedback" hidden></div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
